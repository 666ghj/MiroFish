[project]
name = "research-codex-transport"
version = "0.1.0"
description = "Shared supervised agent CLI inference transports"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_codex", "research_agents"]

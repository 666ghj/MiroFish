name: Runner smoke test
on:
  push:
    paths:
      - ".github/workflows/_smoke.yml"
  workflow_dispatch:
jobs:
  hello:
    runs-on: windows-latest
    steps:
      - name: Say hello
        run: |
          echo "windows runner ok"
          python -V
          echo "artifact test" > out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: smoke
          path: out.txt

<!doctype html>
<html lang="zh">
  <head>
    <script>document.documentElement.lang = localStorage.getItem('locale') || 'zh'</script>
    <!-- UXE fork: Google Fonts removed so the app works fully offline. It was
         the only external request the frontend made, and on an air-gapped box
         it stalls first paint until the request times out.
         The CSS asks for Inter / JetBrains Mono / Noto Sans SC / Space Grotesk
         by name and every rule already declares a local fallback, so install
         the matching system fonts to keep the intended look:
           apt-get install -y fonts-inter fonts-jetbrains-mono fonts-noto-cjk
         (fonts-noto-cjk is what makes Chinese text render correctly.) -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MiroFish - 社交媒体舆论模拟系统" />
    <title>MiroFish - 预测万物</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

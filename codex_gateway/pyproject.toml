[project]
name = "mirofish-codex-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway for Codex ChatGPT subscription access"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.1,<4",
    "gunicorn>=23,<24",
    "openai>=1.109,<2",
    "openai-codex==0.147.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

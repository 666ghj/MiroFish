services:
  gtm-sim:
    # Builds this repository (GTM Simulation Lab), not the upstream image
    build: .
    container_name: gtm-sim
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads

services:
  mirofish:
    build: .
    image: mirofish:latest
    container_name: mirofish
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
      - ./backend/app:/app/backend/app
      - ./backend/scripts:/app/backend/scripts
      - ./frontend/src:/app/frontend/src
      - ./locales:/app/locales
      - ./.env:/app/.env
[project]
name = "my-own-researcher-graph"
version = "0.1.0"
description = "My Own Researcher local temporal graph platform"
requires-python = ">=3.11,<3.13"
dependencies = [
    "graphiti-core==0.30.2",
    "sentence-transformers>=3.2.1,<6",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "python-dotenv>=1",
    "research-codex-transport",
]

[tool.uv.sources]
research-codex-transport = { path = "../shared/codex-transport", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research_graph"]
